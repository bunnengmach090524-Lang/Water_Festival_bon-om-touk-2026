<!doctype html>
<html lang="km" class="lang-km" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1026" />
    <script>
      /* Set the palette before first paint. Mirrors src/composables/useTheme.js. */
      (function () {
        try {
          var saved = localStorage.getItem('bon-om-touk:theme');
          var mode = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'light' ? '#fbf7ee' : '#0b1026');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta
      name="description"
      content="Bon Om Touk — Cambodia's Water Festival, 23–25 November 2026. Discover the traditions, places and practical travel information for the festival along the Tonle Sap and Mekong rivers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bon Om Touk — Cambodia Water Festival 2026" />
    <meta
      property="og:description"
      content="Moonlit river, golden temple. A visitor's guide to Cambodia's Water Festival, 23–25 November 2026."
    />
    <meta property="og:image" content="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Moul&family=Noto+Sans+Khmer:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Bon Om Touk — Cambodia Water Festival 2026</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
